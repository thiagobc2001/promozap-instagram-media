<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07337b">
  <meta name="description" content="Ofertas selecionadas pelo PromoZap. Encontre o link de compra de cada promoção em um só lugar.">
  <title>Ofertas PromoZap</title>
  <style>
    :root{font-family:Inter,Arial,Helvetica,sans-serif;color:#14223a;background:#f2f6fc}
    *{box-sizing:border-box}
    body{margin:0}
    a{color:inherit}
    .hero{background:linear-gradient(145deg,#07337b 0%,#0754b8 62%,#1085db 100%);color:#fff;padding:30px 20px 62px}
    .wrap{max-width:950px;margin:auto}
    .brand{display:inline-flex;align-items:center;gap:10px;font-size:23px;font-weight:850;letter-spacing:-.04em}
    .mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#fff;color:#0754b8;font-weight:900}
    h1{font-size:clamp(29px,6vw,48px);line-height:1.08;letter-spacing:-.045em;margin:45px 0 11px;max-width:660px}
    .hero p{font-size:16px;line-height:1.5;margin:0;max-width:580px;color:#e8f3ff}
    main{padding:0 20px 45px}
    .panel{position:relative;margin-top:-30px;background:#fff;border-radius:22px;box-shadow:0 12px 38px #092b6b19;padding:22px}
    .bar{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:17px}
    h2{font-size:22px;letter-spacing:-.03em;margin:0}
    .small{font-size:13px;color:#64748b;margin:6px 0 0}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}
    .card{border:1px solid #e2eaf5;border-radius:17px;padding:17px;display:flex;flex-direction:column;gap:12px;background:#fff;min-height:190px}
    .card:hover{border-color:#84b7ef;box-shadow:0 7px 20px #0d4e9812}
    .badge{align-self:start;background:#e8f2ff;color:#0754b8;font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
    .title{font-size:16px;line-height:1.3;font-weight:750;margin:0;overflow-wrap:anywhere}
    .bottom{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-top:auto}
    .price{font-size:21px;font-weight:850;color:#074a9c;white-space:nowrap}
    .button{display:inline-block;border-radius:10px;background:#0764c4;color:#fff;text-decoration:none;padding:10px 12px;font-size:13px;font-weight:750;white-space:nowrap}
    .button:hover,.button:focus-visible{background:#064a97}
    .empty{padding:26px 8px;color:#64748b;line-height:1.5}
    footer{padding:0 20px 30px;color:#64748b;font-size:12px;line-height:1.5;text-align:center}
    @media(max-width:450px){.panel{padding:15px}.card{min-height:160px}.bottom{align-items:center}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap">
    <div class="brand"><span class="mark">%</span><span>PromoZap</span></div>
    <h1>Viu no Story? A oferta está aqui.</h1>
    <p>Encontre o produto e toque em “Ver oferta” para abrir o link de compra.</p>
  </div></header>
  <main class="wrap"><section class="panel" aria-labelledby="offers-title">
    <div class="bar"><div><h2 id="offers-title">Ofertas recentes</h2><p class="small" id="count">Carregando ofertas…</p></div></div>
    <div id="offers" class="grid" aria-live="polite"></div>
  </section></main>
  <footer class="wrap">Preços, cupons e disponibilidade podem mudar na loja. Confira as condições antes de comprar.</footer>
  <script>
    const container = document.querySelector('#offers');
    const counter = document.querySelector('#count');
    const allowed = /^https:\/\//i;
    function card(offer){
      if(!offer || typeof offer.title !== 'string' || typeof offer.url !== 'string' || !allowed.test(offer.url)) return null;
      const article = document.createElement('article'); article.className = 'card';
      const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = 'Oferta';
      const title = document.createElement('h3'); title.className = 'title'; title.textContent = offer.title;
      const bottom = document.createElement('div'); bottom.className = 'bottom';
      const price = document.createElement('span'); price.className = 'price'; price.textContent = typeof offer.price === 'string' ? offer.price : '';
      const link = document.createElement('a'); link.className = 'button'; link.href = offer.url; link.target = '_blank'; link.rel = 'sponsored noopener noreferrer'; link.textContent = 'Ver oferta ↗';
      bottom.append(price,link); article.append(badge,title,bottom); return article;
    }
    fetch('./offers.json', {cache:'no-store'})
      .then(response => {if(!response.ok) throw new Error('Falha ao carregar'); return response.json()})
      .then(data => {
        const offers = Array.isArray(data) ? data : [];
        const cards = offers.map(card).filter(Boolean);
        counter.textContent = cards.length ? `${cards.length} ofertas disponíveis` : 'Novas ofertas em breve';
        if(cards.length) container.replaceChildren(...cards);
        else {const p=document.createElement('p');p.className='empty';p.textContent='As próximas ofertas aparecerão aqui.';container.replaceChildren(p)}
      })
      .catch(() => {counter.textContent='Não foi possível carregar as ofertas agora';});
  </script>
</body>
</html>
